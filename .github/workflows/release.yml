# release.yml
#
# Publishes @takazudo/zudo-ogp-check-panel (the only non-private package in the
# workspace) on a v* tag push. The publish runs `npm publish` directly from
# packages/zocp/ — NOT `pnpm -r publish` — because pnpm 11's OIDC token-exchange
# path 404s against npmjs and skips provenance (pnpm/pnpm#11513). npm's
# classic-token `--provenance` on Node 24 (npm CLI >= 11.5.1) attaches a Sigstore
# provenance attestation using the GitHub Actions OIDC token, without requiring
# npmjs.com Trusted-Publishing configuration.
#
# IMPORTANT: NPM_TOKEN must be an Automation-type token (bypasses 2FA).
# A standard user token fails in unattended CI publish because npm requires
# 2FA for scoped publish unless the token type is "Automation".
# Create one at https://www.npmjs.com/settings/<user>/tokens, type "Automation".
#
# ── dist-tag policy ──────────────────────────────────────────────────────────
#   Tag matching *-next.*, *-beta.*, or *-rc.*  → npm dist-tag "next"
#   All other v* tags                           → npm dist-tag "latest"
# Prerelease consumers opt in with `pnpm add @takazudo/zudo-ogp-check-panel@next`.
#
# The pre-publish test gate lives in ci.yml (the package uses jsdom; no
# browser/Playwright step is needed).
#
# Action SHAs are pinned to immutable commits (OpenSSF best practice); the
# trailing comment names the release for human readability.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; skip the npm publish step"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # id-token: write enables npm OIDC-attested provenance via --provenance.
      # Each published tarball carries a signed attestation linking to this run.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 ships npm CLI >= 11.5.1, required for `npm publish --provenance`.
          # CI (ci.yml) stays on Node 22 — the package engines floor — for tests.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm -F @takazudo/zudo-ogp-check-panel build

      - name: Determine dist-tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -next\. ]] || [[ "$TAG" =~ -beta\. ]] || [[ "$TAG" =~ -rc\. ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "Resolved dist-tag: $DIST_TAG (from ref: $GITHUB_REF)"

      - name: DRY RUN — skip publish
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          echo "DRY RUN — would have published with dist-tag '$DIST_TAG'."
          echo "Set dry_run=false on a real v* tag push to publish."

      # Guard: a manual workflow_dispatch on a branch (not a v* tag) must not
      # accidentally publish. dry_run=true is the only safe way to exercise this
      # workflow from a branch.
      - name: Verify publish context (tag ref required)
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            echo "::error::Publish requires a v* tag ref. Got: $GITHUB_REF."
            echo "::error::For manual smoke tests, re-run workflow_dispatch with dry_run=true."
            exit 1
          fi

      - name: Publish to npm
        if: ${{ inputs.dry_run != true && startsWith(github.ref, 'refs/tags/v') }}
        # `npm publish --provenance` (not `pnpm -r publish`) — see the header comment.
        # Run from the package dir so npm publishes the single public package.
        run: cd packages/zocp && npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
